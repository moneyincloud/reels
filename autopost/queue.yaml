  ig_caption: "Never trust a free stock tip. About 50,000 people in one Telegram channel learned why 🦜\n\nAnimal Friday 🐾 Kaadu Bank, Episode 2: Kili's Hot Tip.\nLast week Kili the parrot laughed at Ammu's small grain. This week Kili wants a shortcut: a \"buy this tiny stock today, hurry!\" message. Kili repeats it to the whole jungle. Then Aandhai the owl checks the trades.\n\nThe real jungle (a real SEBI case):\n📱 A Telegram stock-tip channel with about 50,000 subscribers (51,980 in Dec 2021)\n🔁 SEBI found the admins bought shares first, posted buy calls without disclosing they would sell, then sold into the rise\n💰 Unlawful gains: about ₹2.84 crore\n⚖️ Penalties: about ₹5.8 crore in total, plus market bans of 1 to 3 years\n\n🧠 Yaanai Thatha's lesson: when a stranger's tip is free, you are not the customer. You are the exit.\n\n💾 Save this, and send it to the friend who is in five tip groups.\n\nHave you ever been added to a \"free tips\" group? 👇\n\nSources: SEBI final order, 26 Apr 2023 (as reported by PTI/Outlook Business and Reuters); SEBI interim order, Jan 2022 (Bar & Bench, 13 Jan 2022). The Golden Banana group, Kili, Ammu, Mani, Aandhai and Yaanai Thatha are fictional; the SEBI case numbers are real.\nNo returns are promised and no stock is recommended. Education only, not investment advice.\nNot a buy/sell call. Education only.\n\nstock tips telegram | pump and dump India | SEBI order | WhatsApp stock tips scam | Kaadu Bank | Animal Friday\n\n#AnimalFriday #KaaduBank #StockTips #SEBI #moneyincloud\n\nKaadu Bank · Episode 2 · follow for episode 3: Ponni's Hidden Nuts"
  first_comment: "Have you ever been added to a 'free tips' group? Yes or no 👇 (Next Friday: Ponni's Hidden Nuts)"
  yt_title: "Kaadu Bank Ep 2: Kili's Hot Tip | Animal Friday #shorts"
  yt_description: "Kaadu Bank Episode 2: Kili's Hot Tip. Kili the parrot gets a \"buy this tiny stock today, hurry!\" message and repeats it to the whole jungle. Aandhai the owl checks the trades: the tip senders bought first and sold to the crowd.\nThe real case: SEBI's final order of 26 Apr 2023 on a Telegram stock-tip channel with about 50,000 subscribers (51,980 in Dec 2021). SEBI found the admins bought shares first, posted buy calls without disclosing they would sell, then sold into the rise. Unlawful gains about ₹2.84 crore; penalties about ₹5.8 crore; market bans of 1 to 3 years.\nLesson: when a stranger's tip is free, you are not the customer. You are the exit.\n\nSources: SEBI final order, 26 Apr 2023 (as reported by PTI/Outlook Business and Reuters); SEBI interim order, Jan 2022 (Bar & Bench, 13 Jan 2022). Characters and the Golden Banana group are fictional.\nNot a buy/sell call. Education only, not investment advice. Made with the help of Claude, an Anthropic product.\n\nKaadu Bank · Episode 2 · follow for episode 3: Ponni's Hidden Nuts\n#AnimalFriday #KaaduBank #StockTips"
