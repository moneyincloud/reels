  yt_video: how-an-ipo-works-full-chain-lenskart-stt-gst-tax-yt.mp4
  cover: how-an-ipo-works-full-chain-lenskart-stt-gst-tax-cover.jpg
  story: how-an-ipo-works-full-chain-lenskart-stt-gst-tax-story.jpg
  story_delay_min: 60
  ig_caption: "How an IPO actually works, from your UPI block to your tax bill 🔗 (real example: Lenskart)\n\n1️⃣ Papers: draft to SEBI (Jul 2025), price band ₹382–₹402\n2️⃣ You bid: 1 lot = 37 shares = ₹14,874, only BLOCKED by UPI\n3️⃣ Allotment: 28.2x subscribed. Not allotted? Block released\n4️⃣ Where ₹7,278 Cr went: ₹2,150 Cr to Lenskart (fresh issue, 30%), ₹5,128 Cr to old shareholders (OFS, 70%)\n   Lenskart's part: store rent ₹591 Cr, marketing ₹320 Cr, new stores ₹273 Cr, tech ₹213 Cr\n5️⃣ Listing, 10 Nov 2025: opened ₹390 (−3%)\n6️⃣ 1-year timeline: anchors unlocked at 30 & 90 days; 6 months (8 May 2026) ~60% of shares unlocked → block deals\n   Today ₹723 (+80% from ₹402). Past returns don't repeat.\n7️⃣ Selling 1 lot: brokerage often ₹0 · STT 0.1% ₹26.76 · exchange+SEBI ₹0.85 · GST 18% on fees ₹0.15 · DP ~₹21.83 → about ₹50\n8️⃣ Tax on the ₹11,890 gain: within 1 year 20% (₹2,378); after 1 year 12.5% only above ₹1.25 lakh gains a year\n\n🔖 Save this before your next IPO. 📤 Send it to the friend who applies to every IPO.\n\nSources: Lenskart RHP via Chittorgarh/Zerodha/Business Standard; subscription Kotak Neo; listing 5paisa; lock-ins BSE notice & Business Today; prices NSE via INDmoney (25 Nov 2026); charges Zerodha/INDmoney pricing pages; tax: Budget 2026 (Business Standard).\nNot a buy/sell call. Education only. Not tax advice. I may hold some of the stocks named.\n\n#ipo #lenskart #stockmarketindia #ipoallotment #moneyincloud"
  first_comment: "Which step surprised you most: the 70% OFS, the lock-ins, or the ₹50 sell cost? 👇"
  yt_title: "How an IPO Works: Where Your Money Goes, STT, GST & Tax (Lenskart, 1 Year) #shorts"
  yt_description: "The full IPO chain with a real example (Lenskart): papers to SEBI, UPI bid, allotment, fresh issue vs OFS (where the money went), listing day, one-year timeline with lock-ins, the costs of selling one lot (STT, exchange/SEBI fees, GST, DP), and capital gains tax.\nSources: Lenskart RHP, Kotak Neo, 5paisa, BSE, Business Today, Zerodha/INDmoney pricing, Budget 2026. Prices NSE via INDmoney (25 Nov 2026).\nNot a buy/sell call. Education only. Not tax advice. I may hold some of the stocks named."
  yt_tags: ["ipo explained", "how ipo works", "lenskart ipo", "ofs vs fresh issue", "ipo lock in", "stt gst brokerage", "capital gains tax", "moneyincloud"]
