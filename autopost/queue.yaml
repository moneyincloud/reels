- id: goldpredict-2026-11-20
  approved: true   # owner in chat 20 Nov 2026 15:18 IST: "post it now both reels"
  publish_at: 2026-11-20 15:52
  platforms: [youtube, instagram, instagram_trial, instagram_story]
  video: can-you-predict-gold-rate-india-comex-rupee-formula.mp4
  yt_video: can-you-predict-gold-rate-india-comex-rupee-formula-yt.mp4
  cover: can-you-predict-gold-rate-india-comex-rupee-formula-cover.jpg
  story: can-you-predict-gold-rate-india-comex-rupee-formula-story.jpg
  story_delay_min: 60
  ig_caption: "Gold rate in India: can you know tomorrow's price before your jeweller? 🪙\nAlmost. But that's not prediction 👇\n\nMCX gold fell ₹19,621 in 9 trading days (₹1,43,160 on 9 Nov → ₹1,23,539 on 20 Nov, 2:53 PM).\n\nIndia imports almost all its gold, so the price starts in the US (Comex), in $ per ounce. Comex trades while India sleeps, so by 9 AM the night's move is already done.\n\n📐 The formula (before 3% GST):\n₹ per 10 g ≈ Comex $/oz × ₹ per $ ÷ 3.11 × 1.15 (15% import duty since 13 May 2026)\n\n✅ Real check, 18 Nov 2026: $3,797 × 93.44 ÷ 3.11035 × 1.15 = ₹1,31,178. MCX opened at ₹1,31,624 (0.3% apart).\n\n⚠️ It only shows you the next morning. Nobody knows next month: the Fed, the dollar, wars, central banks and import duty can all change it.\n\nSources: MCX gold Dec futures (INDmoney); spot gold 18 Nov 9:07 AM (Ascendants); rupee close 18 Nov (PTI); Customs Notification 16/2026.\n\nNot a buy/sell call. Education only.\nThe formula is an approximation; dealer premiums and making charges vary.\n\n#goldrate #goldpriceindia #moneyincloud"
  first_comment: "Do you check Comex before buying gold, or just ask the jeweller? 👇 Save this formula."
  yt_title: "Can You Predict Gold Rate in India? Comex × Rupee Formula #shorts"
  yt_description: "Can you predict tomorrow's gold rate in India? India's price follows US Comex gold x the rupee + 15% import duty.\nFormula: Rs per 10 g ~ Comex $/oz x Rs per $ / 3.11 x 1.15 (before 3% GST).\nReal check 18 Nov 2026: $3,797 x 93.44 / 3.11035 x 1.15 = Rs 1,31,178; MCX opened Rs 1,31,624.\nSources: MCX gold Dec futures (INDmoney), spot gold 18 Nov 9:07 AM (Ascendants), rupee close 18 Nov (PTI), Customs Notification 16/2026.\nNot a buy/sell call. Education only. #goldrate #goldpriceindia #moneyincloud"
  yt_tags: ["gold rate", "gold price india", "comex gold", "mcx gold", "gold rate today", "gold import duty", "moneyincloud"]

- id: goldhist-2026-11-20
  approved: true   # owner in chat 20 Nov 2026 15:18 IST: "post it now both reels"
  publish_at: 2026-11-20 16:01
  platforms: [youtube, instagram, instagram_trial, instagram_story]
  video: gold-price-india-1990-2026-why-it-fell-why-it-rose.mp4
  yt_video: gold-price-india-1990-2026-why-it-fell-why-it-rose-yt.mp4
  cover: gold-price-india-1990-2026-why-it-fell-why-it-rose-cover.jpg
  story: gold-price-india-1990-2026-why-it-fell-why-it-rose-story.jpg
  story_delay_min: 60
  ig_caption: "Gold in India went from ₹3,452 to ₹1,18,421 for 10 grams. But it crashed many times on the way. Here's why 👇\n\n📈 1991: forex crisis, rupee crashed → gold +24.5% in a year (world price actually fell, $375 → $357)\n📉 1992: gold imports opened, smuggling premium vanished → −4.5%\n😴 1997–2001: Europe's central banks dumped gold; world gold hit $252 (20 Jul 1999). India: ₹5,071 → ₹4,579\n🚀 2002–2012: 2008 crisis + US money printing → ₹4,579 → ₹30,164 (6.6x)\n📉 2013–2016: Fed \"taper tantrum\", world gold −29% in 2013 → India −12% over 3 years\n📈 2020: Covid, near-zero rates, stimulus → gold crossed $2,000; India +31.6%\n🚀 2022–2026: wars + central banks bought 863 tonnes in 2025 → ₹1,18,421 average (FY 2025-26)\n📉 Now: strong dollar + hawkish Fed → MCX gold −13.7% since 9 Nov\n\nThe pattern: gold rises on fear, a weak dollar and a falling rupee. It falls when the dollar is strong and rates go up.\n\nPrices: RBI Handbook of Statistics, Table 35 (Mumbai average, financial year). Others: World Gold Council, LBMA, Reuters, PTI, INDmoney (MCX).\n\nNot a buy/sell call. Education only. Past moves don't predict future prices.\n\n#goldprice #goldrate #moneyincloud"
  first_comment: "Which crash do you remember: 1999, 2013 or this month? 👇"
  yt_title: "Gold Price in India 1990–2026: Why It Fell, Why It Rose #shorts"
  yt_description: "Gold in India, 1990 to 2026: every big fall and every big jump, and why.\n1991 forex crisis +24.5% | 1992 imports opened -4.5% | 1997-2001 central bank selling, $252 low (Jul 1999) | 2002-2012 2008 crisis + QE, 6.6x | 2013 taper tantrum, -12% over 3 yrs | 2020 Covid +31.6% | 2022-26 central banks bought 863 t in 2025 | Nov 2026: strong dollar, MCX -13.7% since 9 Nov.\nPrices: RBI Handbook of Statistics Table 35 (Mumbai avg, FY). Also World Gold Council, LBMA, Reuters, PTI, INDmoney.\nNot a buy/sell call. Education only. Past moves don't predict future prices. #goldprice #goldrate #moneyincloud"
  yt_tags: ["gold price history india", "gold rate", "gold price", "why gold price falls", "rbi gold price", "moneyincloud"]

