    Stocks under ₹50 in the Nifty large, mid & small-cap indices, plus the 7-step filter to check any of them 👇

    A ₹12 share is not a cheap company: Vodafone Idea at ₹12.26 is worth ₹1.36 lakh crore. Price alone tells you nothing; market cap, profit and debt do.

    Listed by market cap (INDmoney/NSE, 17 Nov 2026, 1:48 PM):
    Large (Nifty 100): Vodafone Idea
    Mid (Midcap 150): Indian Overseas Bank, Yes Bank, Suzlon Energy
    Small (Smallcap 250): UCO Bank, Central Bank of India, Motherson Sumi Wiring, IRB Infrastructure, Sagility, Ola Electric, Bharat Coking Coal, Vedanta Power, Trident, NMDC Steel, Vedanta Oil and Gas

    The 7-step filter: market cap not price · 3+ years of profit · debt-to-equity under 1 · promoter holding & pledge · dilution · liquidity & circuit band · ASM/GSM/T2T check.

