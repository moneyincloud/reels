name: autopost
on:
  push:                     # runs right away whenever Claude updates the queue (approvals)
    branches: [main]
    paths: ["autopost/queue.yaml"]
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may start runs late)
    - cron: "0 13 * * *"     # 18:30 IST: wakes early and waits for the 19:00 Instagram slot
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only)"
        type: boolean
        default: false
permissions:
  contents: write            # to commit autopost/posted.json
concurrency:
  group: autopost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always the latest queue + posted.json, never an older commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopost/requirements.txt
      - run: pip install -r autopost/requirements.txt
      - name: Instagram check (read-only, posts nothing)
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python autopost/post.py --check-ig
      - name: Post due reels
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/autopost
        run: python autopost/post.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ github.event.schedule == '0 13 * * *' && '--wait-minutes 90' || '' }}
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          cp autopost/posted.json /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 - <<'PY'
          import json
          mine = json.load(open('/tmp/mine.json')); cur = json.load(open('autopost/posted.json'))
          for k, v in mine.items():
              cur.setdefault(k, {}).update({p: r for p, r in v.items() if p not in cur.get(k, {})})
          json.dump(cur, open('autopost/posted.json', 'w'), indent=1, ensure_ascii=False)
          PY
            git add autopost/posted.json
            git diff --cached --quiet && exit 0
            git commit -qm "autopost: record posts" && git push -q && exit 0
            sleep 5
          done
          exit 1
