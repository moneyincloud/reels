  const cols = [0xffd54f, 0xff5252, 0x69f0ae, 0x40c4ff, 0xff80ab];
  for (let i = 0; i < n; i++) { const c = cols[i % 5]; const m = mesh(new THREE.PlaneGeometry(0.12, 0.2), new THREE.MeshStandardMaterial({ color: c, side: THREE.DoubleSide, emissive: c, emissiveIntensity: 0.3 }),
    box[0] + rnd() * (box[1] - box[0]), box[2] + rnd() * (box[3] - box[2]), box[4] + rnd() * (box[5] - box[4]), false); m.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6); scene.add(m); }
}
function floatCoins(n, box, seed = 3) {
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) { const c = coin(0.2); c.position.set(box[0] + rnd() * (box[1] - box[0]), box[2] + rnd() * (box[3] - box[2]), box[4] + rnd() * (box[5] - box[4])); c.rotation.set(1.2 + rnd(), rnd() * 3, rnd()); scene.add(c); }
}

const UPD = [];           // per-frame procedural updates (u = local seconds)
const camT = new THREE.Vector3();
const camState = { x: 0, y: 4, z: 16, tx: 0, ty: 3.3, tz: 0 };
function setCam(x, y, z, tx, ty, tz) { Object.assign(camState, { x, y, z, tx, ty, tz }); }
function camTo(at, dur, o, ease = 'power2.inOut') { TL.to(camState, { ...o, duration: dur, ease }, at); }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function fcoins(n, box, seed = 3, speed = 0.9) {
  const r = rng(seed); const list = [];
  for (let i = 0; i < n; i++) { const c = coin(0.2); scene.add(c); list.push({ c, x: box[0] + r() * (box[1] - box[0]), y0: r(), z: box[4] + r() * (box[5] - box[4]), rx: r() * 6, sp: 0.6 + r() * 0.8 }); }
  UPD.push(u => { for (const o of list) { const span = box[3] - box[2]; const y = box[3] - (((o.y0 * span) + u * speed * o.sp) % span);
    o.c.position.set(o.x + Math.sin(u * 1.3 + o.rx) * 0.15, y, o.z); o.c.rotation.set(1.2 + u * 2 * o.sp, o.rx, u * o.sp); } });
}
function spark2(pos) {
  const g = new THREE.Group(); g.position.copy(pos);

  const sp = []; const mat = M(0xffe9a8, { e: 0xffc94a, ei: 4 });
  for (let i = 0; i < 70; i++) { const s = mesh(new THREE.SphereGeometry(0.012 + (i % 5) * 0.004, 6, 6), mat, 0, 0.9, 0, false); g.add(s); sp.push(s); }
  const L = new THREE.PointLight(0xffe0a0, 3, 4, 2); L.position.set(0, 0.9, 0); g.add(L);
  scene.add(g);
  UPD.push(u => { const r = rng(Math.floor(u * 30) * 7 + 11); for (const s of sp) { const d = new THREE.Vector3(r() - 0.5, r() - 0.3, r() - 0.5).normalize().multiplyScalar(0.08 + r() * 0.45); s.position.set(d.x, 0.9 + d.y, d.z); } L.intensity = 2.4 + r() * 1.4; });
  return g;
}
function arrow2(pts, color, rad, t0, dur) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.1);
  const mat = M(color, { e: color, ei: 0.3, r: 0.35 });
  const tg = new THREE.TubeGeometry(curve, 160, rad, 16); const tube = mesh(tg, mat); scene.add(tube);
  const head = mesh(new THREE.ConeGeometry(rad * 3, rad * 6, 24), mat); scene.add(head);
  const st = { p: 0.001 }; TL.to(st, { p: 1, duration: dur, ease: 'power1.inOut' }, t0);
  const total = tg.index.count;
  UPD.push(() => { tg.setDrawRange(0, Math.max(6, Math.floor(total * st.p / 6) * 6)); const e = curve.getPoint(st.p), tn = curve.getTangent(st.p);
    head.position.copy(e); head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tn.normalize()); head.visible = st.p > 0.02; });
}
function wave(p, side, base, amp, f, ph = 0) { const piv = p.userData.arms[side].piv; const b = piv.rotation.z; UPD.push(u => { piv.rotation.z = b + Math.sin(u * f + ph) * amp; }); }
function bob(p, amp = 0.08, f = 5, ph = 0) { const y0 = p.position.y; UPD.push(u => { p.position.y = y0 + Math.abs(Math.sin(u * f + ph)) * amp; }); }
function headShake(p, amp = 0.25, f = 6) { const h = p.userData.head; UPD.push(u => { h.rotation.y = Math.sin(u * f) * amp; }); }
function sway(o, amp = 0.15, f = 1.4, ph = 0) { UPD.push(u => { o.rotation.z = Math.sin(u * f + ph) * amp; }); }
function popIn(o, at, s = 1) { o.scale.setScalar(0.0001); TL.to(o.scale, { x: s, y: s, z: s, duration: 0.45, ease: 'back.out(2.2)' }, at); }

  const pans = [];

    const pg = new THREE.Group(); scene.add(pg);

  const links = []; const m = M(color, { m: 0.9, r: 0.25 });
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const l = mesh(new THREE.TorusGeometry(0.16, 0.05, 10, 20), m, Math.cos(a) * r, y, Math.sin(a) * r);
    l.rotation.y = -a; if (i % 2) l.rotation.x = Math.PI / 2; scene.add(l); popIn(l, t0 + i * 0.025, 1); links.push(l); }
  return links;
}
