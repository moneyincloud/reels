<!doctype html>
<html><head><meta charset="utf-8">
<style>

:root{--bg:#F7F3EC;--ink:#1B2235;--mute:#8C8676;--line:#E3DCCD;--or:#E87B00;--or2:#F59E0B;--red:#E5484D;--grn:#16A34A;--blue:#2F6FED;--pur:#7C5CFC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}

.full{position:absolute;left:0;top:0}

#hdr{position:absolute;left:40px;top:150px;width:1000px;height:150px;background:#fff;border:2px solid var(--line);border-radius:26px;box-shadow:0 14px 34px rgba(60,45,20,.08);padding:22px 34px;overflow:hidden}
#kick{font-family:Mono;font-size:24px;color:var(--mute)}

#sc{position:absolute;left:40px;top:330px}
#host{position:absolute;left:925px;top:1720px;transform-origin:50% 100%}
#host img{position:absolute;bottom:0;left:0;display:block}
#hglow{position:absolute;left:760px;top:1360px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(22,163,74,.22),rgba(22,163,74,0) 66%)}
#cap{position:absolute;left:56px;top:1350px;width:700px;font-size:52px;overflow-wrap:break-word;line-height:1.17;color:var(--ink)}
#cap .a{color:var(--grn)}
#src{position:absolute;left:56px;top:1660px;width:720px;font-family:Mono;font-size:19px;line-height:1.4;color:var(--mute)}
</style></head>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eb=(x,s=1.8)=>{x=cl(x);const c=s+1;return 1+c*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const pr=(t,a,d)=>cl((t-a)/d);
const M=D.marks, VO=D.vo, ST=D.starts, DU=D.durs;

const HDR=[['ANIMAL FRIDAY','The Turkey Problem','1,000 DAYS',C.or2],['DAY 1, 2, 3…','Fed every day','HAPPY',C.grn],['THE TURKEY\'S CHART','Confidence keeps rising','DAY 1,000',C.grn],
 ['DAY 1,001','The festival','?!',C.red],['INVESTORS TOO','A real stock','NEXT',C.or2],['YES BANK · AUG 2018','Peak: ~₹400','₹1 LAKH CR+',C.grn],
 ['FEELS SAFE?','Just like the turkey','SAFE?',C.or2],['THE MISTAKE','3 warning signs','STAY',C.or2],['SEP 2018','RBI cuts CEO term','−47%',C.red],

 ['CHECK ANY STOCK','3 warning signs','SAVE',C.or2],['MONEYINCLOUD','Save + follow','@moneyincloud',C.grn]];
const SRC=['Turkey parable: Nassim Taleb, "The Black Swan" (2007), after Bertrand Russell · story illustration','Story illustration · education only','Story illustration · not real data',
 'Story illustration · not real data','Education only · not a buy/sell call','Yes Bank high ₹404 (Aug 2018), stockpricearchive.com · mcap >₹1 lakh cr, ThePrint (7 Mar 2020)','Education only · not a buy/sell call',

 'NSE close ₹16.24, 5 Nov 2026 (INDmoney) vs ₹404 high','Education only · not a buy/sell call','UBS report (2015), promoter pledge, RBI action: ThePrint timeline, 7 Mar 2020','Education only · not a buy/sell call · I may hold some stocks named'];

(function(){const b=$('bg').getContext('2d');b.fillStyle='#F7F3EC';b.fillRect(0,0,1080,1920);b.fillStyle='rgba(140,134,118,.15)';for(let y=20;y<1920;y+=36)for(let x=18;x<1080;x+=36){b.beginPath();b.arc(x,y,2,0,7);b.fill()}})();
const POSES={};for(const [,p] of D.cues){if(!POSES[p]){const im=new Image();im.src=`poses/p${String(p).padStart(2,'0')}.png`;POSES[p]=im}}
window.ready=Promise.all([document.fonts.load('40px Pop'),document.fonts.load('20px Mono'),document.fonts.ready,...Object.values(POSES).map(i=>i.decode())]);

function T(s,x,y,sz,col,al='center',f='Pop'){c.font=`${sz}px ${f}`;c.fillStyle=col;c.textAlign=al;c.textBaseline='middle';c.fillText(s,x,y)}
function RR(x,y,w,h,r,fill,stroke,lw=3){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function chip(s,x,y,bg,fg='#fff',sz=26){c.font=`${sz}px Pop`;const w=c.measureText(s).width+40,h=sz+24;RR(x-w/2,y-h/2,w,h,h/2,bg);T(s,x,y+1,sz,fg);return w}
function popAt(x,y,p,fn){if(p<=0)return;c.save();c.globalAlpha=cl(p*1.5);c.translate(x,y);const s=0.6+0.4*eb(p);c.scale(s,s);fn();c.restore()}

function arrow(x1,y1,x2,y2,col,w=6){c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;c.lineCap='round';const a=Math.atan2(y2-y1,x2-x1),hx=x2-Math.cos(a)*18,hy=y2-Math.sin(a)*18;c.beginPath();c.moveTo(x1,y1);c.lineTo(hx,hy);c.stroke();
 c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-Math.cos(a-0.45)*28,y2-Math.sin(a-0.45)*28);c.lineTo(x2-Math.cos(a+0.45)*28,y2-Math.sin(a+0.45)*28);c.fill();c.restore()}

function tickM(x,y,s,col=C.grn){c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle=col;c.lineWidth=10;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(-18,0);c.lineTo(-4,14);c.lineTo(22,-16);c.stroke();c.restore()}
// flat-vector turkey
function turkey(x,y,s,t=0,mood=0){c.save();c.translate(x,y);c.scale(s,s);const bob=Math.sin(t*3)*3;c.translate(0,bob);
 const fan=['#E87B00','#F59E0B','#E5484D','#C2410C','#F59E0B','#E87B00','#E5484D'];

 c.fillStyle=C.brown;c.beginPath();c.ellipse(0,20,96,84,0,0,7);c.fill();c.fillStyle=C.brown2;c.beginPath();c.ellipse(-8,38,60,52,0,0,7);c.fill();
 c.fillStyle=C.brown;c.beginPath();c.ellipse(64,-58,36,40,0,0,7);c.fill();
 c.fillStyle='#fff';c.beginPath();c.arc(76,-66,11,0,7);c.fill();c.fillStyle=C.ink;c.beginPath();c.arc(79,-66,6,0,7);c.fill();
 if(mood===1){c.strokeStyle=C.ink;c.lineWidth=5;c.beginPath();c.moveTo(64,-86);c.lineTo(90,-80);c.stroke()}
 c.fillStyle=C.or2;c.beginPath();c.moveTo(96,-58);c.lineTo(126,-48);c.lineTo(96,-40);c.fill();
 c.fillStyle=C.red;c.beginPath();c.ellipse(98,-26,9,20,0.2,0,7);c.fill();
 c.strokeStyle=C.or;c.lineWidth=8;c.lineCap='round';for(const lx of [-26,26]){c.beginPath();c.moveTo(lx,96);c.lineTo(lx,138);c.lineTo(lx+18,146);c.moveTo(lx,138);c.lineTo(lx-16,148);c.stroke()}
 c.restore()}
function grainBag(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#D9B26F';c.beginPath();c.moveTo(-60,-70);c.lineTo(60,-70);c.lineTo(75,80);c.lineTo(-75,80);c.closePath();c.fill();c.fillStyle='#B88A45';c.fillRect(-62,-84,124,20);T('GRAIN',0,10,30,'#6B4A1F');c.restore()}
// chart frame
function axes(x0,y0,w,h){c.strokeStyle=C.line;c.lineWidth=4;c.beginPath();c.moveTo(x0,y0-h);c.lineTo(x0,y0);c.lineTo(x0+w,y0);c.stroke()}
function confPts(x0,y0,w,h){const pts=[];for(let i=0;i<=60;i++){const k=i/60;pts.push([x0+k*w,y0-30-(h-80)*Math.pow(k,0.8)+Math.sin(i*1.9)*8])}return pts}
function drawPts(pts,g,col,w=8){const m=Math.max(2,Math.round(pts.length*cl(g)));c.strokeStyle=col;c.lineWidth=w;c.lineJoin='round';c.lineCap='round';c.beginPath();for(let i=0;i<m;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke()}

function S0(t){popAt(500,370,pr(t,0.05,0.5),()=>turkey(0,0,1.45,t));const n=Math.min(1000,Math.floor(pr(t,0.5,2.4)*1000));

 for(let i=0;i<16;i++){const k=(t*0.8+i/16)%1;if(t>M.feed){c.fillStyle=C.or2;c.beginPath();c.arc(260+(i%4)*14+k*240,260+k*360,7,0,7);c.fill()}}
 turkey(640,600,1.15,t);
 popAt(660,210,pr(t,M.love-0.2,0.4),()=>{RR(-280,-80,560,160,40,C.redl,C.red,4);c.fillStyle=C.redl;c.beginPath();c.moveTo(-30,78);c.lineTo(10,140);c.lineTo(40,78);c.fill();T('"Humans love me!"',0,2,50,C.red)});
 if(t>M.love+0.5)for(let i=0;i<3;i++){const k=(t*0.6+i/3)%1;c.globalAlpha=1-k;heart(880+i*20-k*30,120-k*120,1.2,C.red);c.globalAlpha=1}}

 const pts=confPts(x0,y0,w,h);const gp=0.05+(t>M.d100?eo(pr(t,M.d100,1.0))*0.15:0)+(t>M.d500?eo(pr(t,M.d500,1.0))*0.35:0)+(t>M.d1000?eo(pr(t,M.d1000,1.0))*0.45:0)+eo(pr(t,ST[2]+0.2,0.5))*0.0;
 c.save();c.beginPath();const m=Math.max(2,Math.round(pts.length*cl(gp)));for(let i=0;i<m;i++)c.lineTo(pts[i][0],pts[i][1]);c.lineTo(pts[m-1][0],y0);c.lineTo(x0,y0);c.closePath();c.fillStyle='rgba(22,163,74,.10)';c.fill();c.restore();drawPts(pts,gp,C.grn,9);
 [[0.17,'100',M.d100],[0.5,'500',M.d500],[1.0,'1,000',M.d1000]].forEach(([k,l,tm])=>popAt(x0+k*w,y0+50,pr(t,tm,0.35),()=>chip('DAY '+l,0,0,C.ink,'#fff',24)));
 popAt(x0+w-140,y0-h+60,pr(t,M.conf-0.2,0.4),()=>turkey(0,0,0.5,t));stamp('ALL-TIME HIGH',x0+w-360,y0-h+200,C.grn,pr(t,M.conf,0.35),40,-0.06)}
function S3(t){const x0=110,y0=800,w=700,h=600;axes(x0,y0,w+120,h);const pts=confPts(x0,y0,w,h);drawPts(pts,1,C.grn,9);
 popAt(x0+w+20,210,pr(t,M.fest-0.3,0.4),()=>{RR(-120,-100,240,200,20,'#fff',C.red,5);RR(-120,-100,240,56,[20,20,0,0],C.red);T('DAY',0,-72,26,'#fff','center','Mono');T('1,001',0,30,70,C.red)});
 if(t>M.never-0.2){const q=eo(pr(t,M.never-0.2,0.35));c.strokeStyle=C.red;c.lineWidth=12;c.lineCap='round';c.beginPath();c.moveTo(x0+w,pts[60][1]);c.lineTo(x0+w+30,pts[60][1]+(y0-pts[60][1]-10)*q);c.stroke();

 c.setLineDash([14,12]);c.strokeStyle='#B9B2A4';c.lineWidth=6;const g0=eo(pp[0]);c.beginPath();c.moveTo(80,yb(60));c.lineTo(80+(XS[1]-80)*g0,yb(60)+(yb(404)-yb(60))*g0);c.stroke();c.setLineDash([]);
